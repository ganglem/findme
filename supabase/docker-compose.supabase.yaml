# Supabase self-hosted stack (based on supabase/supabase docker example)
# Included as a separate compose file so your main app compose stays readable.
# Usage (together with your root docker-compose.yaml):
#   docker compose -f docker-compose.yaml -f supabase/docker-compose.supabase.yaml --env-file .env up -d

services:
  supabase-db:
    container_name: supabase-db
    image: supabase/postgres:15.6.1.146
    restart: unless-stopped
    networks:
      - supabase
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  supabase-kong:
    container_name: supabase-kong
    image: kong:2.8
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - supabase
      - web
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    volumes:
      - ./supabase/kong.yml:/home/kong/kong.yml:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.supabase-api.rule=Host(`${SUPABASE_DOMAIN}`)
      - traefik.http.routers.supabase-api.entrypoints=websecure
      - traefik.http.routers.supabase-api.tls=true
      - traefik.http.routers.supabase-api.tls.certresolver=lets-encrypt
      - traefik.http.services.supabase-api.loadbalancer.server.port=8000
      - traefik.docker.network=web

  supabase-auth:
    container_name: supabase-auth
    image: supabase/gotrue:v2.158.0
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - supabase
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB:-postgres}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP:-true}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}

  supabase-rest:
    container_name: supabase-rest
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - supabase
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}

  supabase-realtime:
    container_name: supabase-realtime
    image: supabase/realtime:v2.30.0
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - supabase
    environment:
      PORT: 4000
      DB_HOST: supabase-db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ERL_AFLAGS: "-proto_dist inet_tcp"

  supabase-storage:
    container_name: supabase-storage
    image: supabase/storage-api:v1.10.1
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - supabase
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB:-postgres}
      FILE_SIZE_LIMIT: ${STORAGE_FILE_SIZE_LIMIT:-52428800}
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: ${STORAGE_TENANT_ID:-stub}
      REGION: ${STORAGE_REGION:-stub}
      GLOBAL_S3_BUCKET: ${STORAGE_BUCKET:-stub}
    volumes:
      - supabase_storage_data:/var/lib/storage

  supabase-meta:
    container_name: supabase-meta
    image: supabase/postgres-meta:v0.86.0
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - supabase
    environment:
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: ${POSTGRES_USER:-postgres}
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PG_META_PORT: 8080

  supabase-studio:
    container_name: supabase-studio
    image: supabase/studio:2025.02.03-sha-1c2b56d
    restart: unless-stopped
    depends_on:
      supabase-meta:
        condition: service_started
    networks:
      - supabase
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      NEXT_PUBLIC_ENABLE_LOGS: "false"

networks:
  supabase:
    name: supabase
  web:
    external: true

volumes:
  supabase_db_data:
  supabase_storage_data:
